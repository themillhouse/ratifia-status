owner: themillhouse
repo: ratifia-status

# Components are user-facing capabilities, not internal services.
# A component belongs here only if we can actually measure it — see OPERATIONS.md.
sites:
  # API + Postgres + config. Returns 503 (not 200) when the DB is unreachable
  # or required config is missing, so a degraded control plane shows as down.
  - name: Decision API
    url: https://api.ratifia.com/health

  # Where a reviewer reads their inbox and records a verdict.
  #
  # NOT the root: Clerk's auth.protect() answers a signed-out GET / with 404
  # (x-clerk-auth-reason: protect-rewrite), so the root reads as permanently
  # down even when the app is perfectly healthy.
  #
  # NOT /api/health either: that route is `Response.json({status:'ok'})` — it
  # proves the Node process is alive and nothing else.
  #
  # /sign-in is the reviewer's real entry point and a genuinely rendered page,
  # so it fails when a reviewer would actually be unable to get in.
  - name: Reviewer Dashboard
    url: https://app.ratifia.com/sign-in
    maxResponseTime: 5000

status-website:
  cname: status.ratifia.com
  name: Ratifia Status
  introTitle: Ratifia Status
  introMessage: Live availability for the Ratifia decision control plane. Checked every 5 minutes from GitHub Actions; history is public and append-only.
  navbar:
    - title: Status
      href: /
    - title: Ratifia
      href: https://ratifia.com

# Incident issues are opened in this repo — assign them so they are owned.
assignees:
  - Souvent22

# Notifications: wire an internal ops channel before launch (FN-197 phase 1).
# Upptime supports Slack/Discord/Telegram/email via repo secrets — see
# https://upptime.js.org/docs/notifications
# notifications:
